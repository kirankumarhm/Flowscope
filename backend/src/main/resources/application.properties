spring.application.name=flowscope-web
flowscope.version=@project.version@
server.port=${PORT:8080}
# Loopback only by default: the API parses any directory it is pointed at and has
# no authentication. Set FLOWSCOPE_BIND_ADDRESS=0.0.0.0 to expose it deliberately.
server.address=${FLOWSCOPE_BIND_ADDRESS:127.0.0.1}

# --- Path restriction --------------------------------------------------------
# Optional comma-separated list of directories the API and MCP tools may read.
# Empty (the default) allows any path the process can read.
flowscope.allowed-roots=${FLOWSCOPE_ALLOWED_ROOTS:}

# --- CORS ------------------------------------------------------------------
# This is a pure REST API; the React SPA is built and served separately.
# Comma-separated list of allowed browser origins (Vite dev server by default).
flowscope.cors.allowed-origins=http://localhost:5173

# --- Request/response sizing & timeouts ------------------------------------
# Analysis responses can be large; workspace scans can be slow.
server.tomcat.max-http-response-header-size=64KB
server.tomcat.max-swallow-size=10MB
spring.mvc.async.request-timeout=190000

# Compress large JSON diagram payloads over the wire.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/css,application/javascript
server.compression.min-response-size=2KB

# --- Graceful shutdown -----------------------------------------------------
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# --- Error responses -------------------------------------------------------
# Never leak stack traces; GlobalExceptionHandler returns a clean JSON body.
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never

# --- Actuator (production observability) -----------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
info.app.name=FlowScope
info.app.description=Reverse-engineering diagram tool

# --- OpenAPI / Swagger UI --------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.packages-to-scan=com.flowscope.controller,com.flowscope.mcp.controller

# --- LLM provider (optional) -----------------------------------------------
# Powers the "Business logic" view. Provider-neutral: point base-url at any
# endpoint speaking either wire format and FlowScope will use it. Leave api-key
# blank to keep FlowScope fully offline — the view falls back to heuristics.
#
# wire-format:  chat_completions (OpenAI-style /chat/completions — also Ollama,
#               vLLM, LM Studio, most gateways) | messages (Anthropic-style)
# auth-scheme:  bearer | api_key_header | azure_api_key | none
# extra-header: one extra "Name: value" header some gateways require
#
# Prefer environment variables over committing a key:
#   FLOWSCOPE_LLM_BASE_URL, FLOWSCOPE_LLM_API_KEY, FLOWSCOPE_LLM_MODEL
flowscope.llm.enabled=true
flowscope.llm.base-url=${FLOWSCOPE_LLM_BASE_URL:}
flowscope.llm.api-key=${FLOWSCOPE_LLM_API_KEY:}
flowscope.llm.model=${FLOWSCOPE_LLM_MODEL:}
flowscope.llm.wire-format=${FLOWSCOPE_LLM_WIRE_FORMAT:chat_completions}
flowscope.llm.auth-scheme=${FLOWSCOPE_LLM_AUTH_SCHEME:bearer}
flowscope.llm.extra-header=${FLOWSCOPE_LLM_EXTRA_HEADER:}
flowscope.llm.max-tokens=2000
flowscope.llm.timeout-seconds=90

# --- Logging ---------------------------------------------------------------
logging.level.root=INFO
logging.level.com.flowscope=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
